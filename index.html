<html lang="en"> 
<head> 
<meta charset="UTF-8"/> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"/> 
<title>NEON FIST — Cyberpunk Beat Em Up</title> 
<style> 
*{margin:0;padding:0;box-sizing:border-box;} 
body{ 
  background:#000; 
  display:flex;flex-direction:column; 
  align-items:center;justify-content:center; 
  height:100vh;overflow:hidden; 
  font-family:'Courier New',monospace; 
} 
#gameWrapper{ 
  position:relative; 
  width:800px;height:480px; 
  border:2px solid #0ff; 
  box-shadow:0 0 30px #0ff,0 0 60px #005f5f; 
} 
canvas{ 
  display:block; 
  image-rendering:pixelated; 
  image-rendering:crisp-edges; 
  width:800px;height:480px; 
} 
#crt{ 
  position:absolute;top:0;left:0; 
  width:100%;height:100%; 
  background:repeating-linear-gradient( 
    to bottom, 
    rgba(0,0,0,0.10) 0px, 
    rgba(0,0,0,0.10) 1px, 
    transparent 1px, 
    transparent 3px 
  ); 
  pointer-events:none;z-index:10; 
} 
#hud{ 
  position:absolute;top:8px;left:8px; 
  z-index:5;color:#0ff; 
  font-family:'Courier New',monospace; 
  font-size:13px; 
  text-shadow:0 0 6px #0ff; 
} 
#hpBar{ 
  width:160px;height:10px; 
  background:#111;border:1px solid #0ff; 
  margin-top:3px; 
} 
#hpFill{ 
  height:100%;width:100%; 
  background:linear-gradient(90deg,#0ff,#00f); 
  transition:width 0.2s; 
} 
#scoreBox{ 
  position:absolute;top:8px;right:8px; 
  z-index:5;color:#f0f; 
  font-family:'Courier New',monospace; 
  font-size:13px; 
  text-shadow:0 0 6px #f0f; 
  text-align:right; 
} 
#overlay{ 
  position:absolute;top:0;left:0; 
  width:100%;height:100%; 
  background:rgba(0,0,0,0.82); 
  display:flex;flex-direction:column; 
  align-items:center;justify-content:center; 
  z-index:20;color:#0ff; 
  font-family:'Courier New',monospace; 
  text-align:center; 
} 
#overlay h1{ 
  font-size:42px;letter-spacing:6px; 
  text-shadow:0 0 20px #0ff,0 0 40px #0ff; 
  margin-bottom:10px; 
} 
#overlay p{ 
  font-size:14px;color:#aff; 
  margin-bottom:6px; 
  text-shadow:0 0 6px #0ff; 
} 
#overlay button{ 
  margin-top:18px; 
  padding:10px 32px; 
  background:transparent; 
  border:2px solid #0ff; 
  color:#0ff;font-size:16px; 
  font-family:'Courier New',monospace; 
  letter-spacing:3px;cursor:pointer; 
  text-shadow:0 0 8px #0ff; 
  box-shadow:0 0 12px #0ff; 
  transition:all 0.2s; 
} 
#overlay button:hover{ 
  background:#0ff;color:#000; 
} 
/* Mobile Touch Controls */ 
#touchControls{ 
  position:absolute;bottom:10px;left:0; 
  width:100%;display:flex; 
  justify-content:space-between; 
  align-items:flex-end; 
  padding:0 12px;z-index:15; 
  pointer-events:none; 
} 
.dpad{ 
  display:grid; 
  grid-template-columns:repeat(3,40px); 
  grid-template-rows:repeat(3,40px); 
  gap:3px;pointer-events:all; 
} 
.dpad button{ 
  background:rgba(0,255,255,0.12); 
  border:1px solid rgba(0,255,255,0.5); 
  color:#0ff;font-size:16px;cursor:pointer; 
  border-radius:4px; 
  text-shadow:0 0 6px #0ff; 
  -webkit-tap-highlight-color:transparent; 
} 
.dpad button:active{background:rgba(0,255,255,0.35);} 
.actionBtns{ 
  display:flex;flex-direction:column; 
  gap:6px;pointer-events:all; 
} 
.actionBtns button{ 
  width:52px;height:52px; 
  background:rgba(255,0,255,0.12); 
  border:1px solid rgba(255,0,255,0.5); 
  color:#f0f;font-size:13px; 
  font-family:'Courier New',monospace; 
  cursor:pointer;border-radius:50%; 
  text-shadow:0 0 6px #f0f; 
  -webkit-tap-highlight-color:transparent; 
} 
.actionBtns button:active{background:rgba(255,0,255,0.35);} 
/* Ad placeholder */ 
#adBanner{ 
  width:800px;height:32px; 
  background:#0a0a0a; 
  border:1px solid #222; 
  display:flex;align-items:center; 
  justify-content:center; 
  color:#333;font-size:11px; 
  font-family:'Courier New',monospace; 
  margin-top:4px; 
} 
</style> 
</head>

// --- Audio Engine (Web Audio API — no external files) --- 
const AC = new (window.AudioContext || window.webkitAudioContext)(); 
function playSound(type) { 
  const o = AC.createOscillator(), g = AC.createGain(); 
  o.connect(g); g.connect(AC.destination); 
  if (type === 'punch') { o.type='square'; o.frequency.setValueAtTime(180,AC.currentTime); o.frequency.exponentialRampToValueAtTime(60,AC.currentTime+0.12); g.gain.setValueAtTime(0.4,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.15); } 
  else if (type === 'kick') { o.type='sawtooth'; o.frequency.setValueAtTime(220,AC.currentTime); o.frequency.exponentialRampToValueAtTime(40,AC.currentTime+0.18); g.gain.setValueAtTime(0.5,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.2); } 
  else if (type === 'jump') { o.type='sine'; o.frequency.setValueAtTime(300,AC.currentTime); o.frequency.exponentialRampToValueAtTime(600,AC.currentTime+0.1); g.gain.setValueAtTime(0.2,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.15); }

  o.start(AC.currentTime); o.stop(AC.currentTime+0.6); 
} 
 
// --- Game State --- 
let gameRunning = false, score = 0, wave = 1; 
let hiScore = parseInt(localStorage.getItem('neonFistHi')||'0'); 
document.getElementById('hiVal').textContent = hiScore;

// --- Particles --- 
const particles = []; 
function spawnParticles(x, y, color, count) { 
  for (let i = 0; i < count; i++) { 
    const angle = Math.random() * Math.PI * 2; 
    const speed = 1.5 + Math.random() * 3; 
    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 1, life: 20 + Math.random()*15, maxLife: 35, color });

}

  for (let i = particles.length - 1; i >= 0; i--) { 
    const p = particles[i]; 
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; 
    if (p.life <= 0) particles.splice(i, 1); 
  } 
} 
function drawParticles() { 
  particles.forEach(p => { 
    ctx.globalAlpha = p.life / p.maxLife; 
    ctx.fillStyle = p.color; 
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 3, 3); 
  }); 
  ctx.globalAlpha = 1; 
}

const GROUND_TOP = 260, GROUND_BOT = 420;

  hurtCooldown: 0, 
  hitbox: null, 
  animFrame: 0, animTimer: 0, 
  punchPressed: false, kickPressed: false, jumpPressed: false, 
}; 
 
// --- Enemies --- 
function makeEnemy(x, y, hp, speed) { 
  return { x, y, z: 0, vz: 0, w: 26, h: 42, speed, hp, maxHp: hp, 
    facing: -1, state: 'patrol', stateTimer: 0, attackCooldown: 0, 
    hurtCooldown: 0, hitbox: null, animFrame: 0, animTimer: 0, 
    patrolDir: 1, patrolTimer: 60, alertTimer: 0, dead: false }; 
} 
let enemies = []; 
 
function spawnWave(w) { 
  enemies = []; 
  const count = Math.min(2 + w, 5); 
  for (let i = 0; i < count; i++) { 
    const side = i % 2 === 0 ? 650 + i * 40 : 50 - i * 20; 
    const yPos = GROUND_TOP + 40 + Math.random() * (GROUND_BOT - GROUND_TOP - 80); 
    const spd = 1.2 + w * 0.15 + Math.random() * 0.3; 
    const ehp = 40 + w * 10; 
    enemies.push(makeEnemy(Math.max(30, Math.min(770, side)), yPos, ehp, spd)); 
  } 
}

      gain.gain.setValueAtTime(0.5, ac.currentTime); 
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.25); 
      osc.start(); osc.stop(ac.currentTime + 0.25); 
    } 
  } catch(e) {} 
} 
 
// ---- PARTICLE SYSTEM ---- 
function spawnParticles(x, y, color, count) { 
  for (let i = 0; i < count; i++) { 
    const angle = Math.random() * Math.PI * 2; 
    const speed = 1.5 + Math.random() * 3; 
    particles.push({ 
      x, y, 
      vx: Math.cos(angle) * speed, 
      vy: Math.sin(angle) * speed, 
      life: 1.0, 
      decay: 0.04 + Math.random() * 0.04, 
      size: 2 + Math.random() * 3, 
      color 
    }); 
  } 
} 
 
function updateParticles() { 
  for (let i = particles.length - 1; i >= 0; i--) { 
    const p = particles[i]; 
    p.x += p.vx; p.y += p.vy; 
    p.vy += 0.15; 
    p.life -= p.decay; 
    if (p.life <= 0) particles.splice(i, 1); 
  } 
} 
 
function drawParticles() { 
  for (const p of particles) { 
    ctx.globalAlpha = p.life; 
    ctx.fillStyle = p.color; 
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size); 
  } 
  ctx.globalAlpha = 1; 
}

function createEnemy(x, y, id) { 
  return { 
    id, x, y, z: 0, vz: 0, 
    w: 24, h: 40, 
    hp: 60, maxHp: 60, 
    speed: 1.2 + wave * 0.15, 
    facing: -1, 
    state: 'patrol',   // FSM: 'patrol'|'chase'|'attack'|'hurt'|'dead' 
    stateTimer: 0, 
    attackCooldown: 0, 
    hurtTimer: 0, 
    patrolDir: 1, 
    patrolTimer: 60 + Math.random() * 60, 
    animFrame: 0, 
    animTimer: 0, 
 
    getHurtBox() { 
      return { 
        x: this.x - this.w / 2, 
        y: this.y - this.z - this.h, 
        w: this.w, h: this.h, 
        depth: this.y 
      }; 
    }, 
 
    getAttackBox() { 
      const reach = this.facing === 1 ? this.x + this.w : this.x - 36; 
      return { x: reach, y: this.y - this.z - this.h, w: 36, h: this.h, depth: this.y }; 
    }, 
 
    // FSM Update 
    update() { 
      if (this.state === 'dead') return; 
      if (hitStopFrames > 0) return; 
 
      const dx = player.x - this.x; 
      const dy = player.y - this.y; 
      const dist = Math.sqrt(dx * dx + dy * dy); 
 
      // Hurt cooldown 
      if (this.hurtTimer > 0) { this.hurtTimer--; return; } 
 
      // FSM transitions 
      if (this.state === 'patrol') { 
        this.x += this.patrolDir * this.speed * 0.5; 
        this.patrolTimer--; 
        if (this.patrolTimer <= 0) { 
          this.patrolDir *= -1; 
          this.patrolTimer = 60 + Math.random() * 60; 
        } 
        if (dist < 200) this.state = 'chase'; 
      } 
 
      else if (this.state === 'chase') { 
        // Flank: align Y-depth first, then close X distance 
        if (Math.abs(dy) > 12) { 
          this.y += (dy / Math.abs(dy)) * this.speed * 0.7; 
        } 
        if (Math.abs(dx) > 40) { 
          this.x += (dx / Math.abs(dx)) * this.speed; 
        } 
        this.facing = dx > 0 ? 1 : -1; 
        if (dist < 45) { this.state = 'attack'; this.stateTimer = 30; } 
        if (dist > 300) this.state = 'patrol'; 
      } 
 
      else if (this.state === 'attack') { 
        this.stateTimer--; 
        if (this.attackCooldown > 0) { this.attackCooldown--; } 
        if (this.stateTimer <= 0) { 
          // Attempt to hit player 
          if (this.attackCooldown <= 0 && dist < 50) { 
            const depthDiff = Math.abs(this.y - player.y); 
            if (depthDiff < 30 && player.invincible <= 0) { 
              player.hp -= 10; 
              player.hp = Math.max(0, player.hp); 
              player.invincible = 40; 
              player.hurtTimer = 20; 
              player.state = 'hurt'; 
              spawnParticles(player.x, player.y - 20, '#f00', 8); 
              shakeTimer = 8; shakeIntensity = 3; 
              playSound('hurt'); 
              document.getElementById('hpVal').textContent = player.hp; 
              document.getElementById('hpBar').style.width = player.hp + '%'; 
            } 
            this.attackCooldown = 50; 
          } 
          this.state = 'chase'; 
          this.stateTimer = 30; 
        } 
      } 
 
      // Clamp to ground belt 
      this.y = Math.max(GROUND_TOP + 20, Math.min(GROUND_BOT - 10, this.y)); 
      this.x = Math.max(20, Math.min(W - 20, this.x)); 
      this.facing = (player.x - this.x) > 0 ? 1 : -1; 
    } 
  }; 
}

<div id="gameWrapper">

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let gameState = 'start', score = 0, player = {x:400, y:350, hp:100};
const keys = {};

document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  gameState = 'playing';
  gameLoop();
});

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, 800, 480);
  ctx.fillStyle = '#0ff';
  ctx.fillRect(player.x, player.y, 30, 50);
}

function gameLoop() {
  if (gameState !== 'playing') return;
  if (keys['ArrowLeft']) player.x -= 5;
  if (keys['ArrowRight']) player.x += 5;
  draw();
  requestAnimationFrame(gameLoop);
}
</script>
